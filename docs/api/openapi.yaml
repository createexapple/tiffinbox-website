openapi: 3.0.3
info:
  title: Tiffin Box website + admin - HTTP surface
  version: 0.2.0-stage3
  description: |
    Stage 3 (implemented; see docs/backend.md for what was and was not run against the real staging project).

    This project has NO custom REST API (docs/architecture.md, ADR-0001, ADR-0002).
    The admin dashboard changes data through Next.js server actions, which are
    framework-internal calls, not public HTTP endpoints, and are therefore not
    listed as paths. They are catalogued under `x-server-actions` at the bottom.

    The HTTP surface that really exists is:
      1. Route handlers in the web app (tag: app): /api/health, /api/revalidate, /admin/preview.
      2. Database functions we wrote, exposed by Supabase at /rest/v1/rpc/* (tag: rpc).
         They are called server-to-server by the web app. They are listed because they
         are reachable over HTTPS by anyone who has the project URL and public key,
         so their authorisation is part of the contract: only get_public_content() is
         executable by the public role; every other function starts with an admin check
         and answers PT403 to anyone else.
      3. Supabase's own generated endpoints: table and view access at /rest/v1/<name>,
         Auth at /auth/v1/*, Storage at /storage/v1/*. These are vendor-defined and
         not redefined here. Table access is governed by row-level security:
         the public role has no table or view grants at all; active admins have the rights in
         docs/database.md sec. 3. The app reads these views with the admin's own session:
         subscription_status, period_payment_status, subscription_balance, customer_summary,
         menu_week_status, dashboard_overview, change_history. Supabase publishes the generated
         spec at /rest/v1/ ; it is not copied here.

    Contract notes (docs/database.md sec. 10): menu `day_of_week` is 1 = Monday in the database
    and 0 = Monday in the admin UI (mapped in src/admin/server/mappers.ts); menu status `published`
    in the database is shown as `live` in the UI; customer phones are stored as +923XXXXXXXXX and
    shown as 03XXXXXXXXX.

    Error mapping (src/admin/server/errors.ts): PostgREST returns `{code, message, details, hint}`.
    PT400 = validation failed (details is a JSON array of {field, message}; nothing changed) becomes a
    field-level or "blocked" (publish) error; PT403 = not an active admin becomes "forbidden"; PT404
    becomes "not found". Database messages other than PT400 details are never shown to the user.

    Update this file in the same PR as any change to a route handler or database function.
servers:
  - url: https://{appHost}
    description: Web app (route handlers)
    variables:
      appHost:
        default: staging.example.invalid
  - url: https://{supabaseProject}.supabase.co
    description: Supabase project (rpc paths)
    variables:
      supabaseProject:
        default: project-ref
tags:
  - name: app
    description: Route handlers in the Next.js app
  - name: rpc
    description: PostgreSQL functions exposed through Supabase PostgREST
paths:
  /api/health:
    get:
      tags: [app]
      summary: Liveness check for uptime monitoring
      description: Returns 200 when the web app is running. Does not call the backend and returns no data about content or customers.
      security: []
      responses:
        '200':
          description: App is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/revalidate:
    post:
      tags: [app]
      summary: Expire the cached public content
      description: |
        Called by the Supabase Cron go-live notifier (docs/architecture.md sec. 8.4) and usable in the post-deploy
        smoke test. Admin publishing expires the same cache tag inside its server action and does not need this
        endpoint. Authenticated with a shared secret (`Authorization: Bearer <REVALIDATE_SECRET>`). With no secret
        configured the route answers 503 and never acts. Rate limited to 30 requests a minute per caller address.
      security:
        - revalidateSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevalidateRequest'
      responses:
        '200':
          description: Cache tag expired; the next visit re-reads the database
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevalidateResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          description: REVALIDATE_SECRET is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/preview:
    get:
      tags: [app]
      summary: Turn draft preview on or off for the signed-in admin
      description: |
        Admin only (the auth proxy redirects anyone else to the login page; the handler checks again). Enables
        the framework's draft mode and redirects to a public page that then renders the draft content, fetched
        with the admin's own session (the cookie alone grants nothing). `to` must be one of a fixed list of local
        paths. Not a link to prefetch: it has a side effect, so the UI uses a plain anchor.
      security:
        - adminSession: []
      parameters:
        - name: to
          in: query
          schema:
            type: string
            enum: ['/', '/menu', '/plans', '/customize', '/about', '/how-it-works', '/admin/publish', '/admin/menu']
        - name: week
          in: query
          description: Menu week (uuid) whose working slots the menu page previews
          schema:
            type: string
            format: uuid
        - name: disable
          in: query
          description: "1 turns preview off"
          schema:
            type: string
            enum: ['1']
      responses:
        '307':
          description: Redirect to the chosen page, or to the login page without an admin session
  /rest/v1/rpc/get_public_content:
    post:
      tags: [rpc]
      summary: Published site content plus the live menu week
      description: The only database object the public role may use. Returns no draft content and no customer, subscription or payment data.
      security:
        - supabaseKey: []
      responses:
        '200':
          description: Published content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
  /rest/v1/rpc/get_draft_content:
    post:
      tags: [rpc]
      summary: Draft content for preview (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                menu_week_id:
                  type: string
                  format: uuid
                  description: Menu week to preview; defaults to the live week's working copy
      responses:
        '200':
          description: Same shape as published content, built from draft tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicContent'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/draft_status:
    post:
      tags: [rpc]
      summary: Whether unpublished content changes exist, and the scheduled menu (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      responses:
        '200':
          description: Draft status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftStatus'
  /rest/v1/rpc/publish_content:
    post:
      tags: [rpc]
      summary: Validate drafts and create a new content release (admin only, transactional)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: New release created and made current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseSummary'
        '400':
          description: Validation failed (placeholder settings, plan without price, missing alt text); nothing changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/rollback_release:
    post:
      tags: [rpc]
      summary: Make an earlier content release current (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
      responses:
        '200':
          description: Earlier release is current again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseSummary'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/release_menu_week:
    post:
      tags: [rpc]
      summary: Publish a menu week now, schedule it, update a scheduled week, or cancel its schedule (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuReleaseRequest'
      responses:
        '200':
          description: Menu week with its derived status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuWeekStatus'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/save_menu_week:
    post:
      tags: [rpc]
      summary: Save the 21 working slots of a menu week, creating the week if needed (admin only)
      description: Refreshes the snapshot of a SCHEDULED week in the same transaction; a live week keeps its snapshot until released again (FR-14).
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [week_start, slots]
              properties:
                week_start:
                  type: string
                  format: date
                  description: Monday of the week
                slots:
                  type: array
                  minItems: 21
                  maxItems: 21
                  items:
                    type: object
                    required: [day_of_week, meal, dish_text, not_served]
                    properties:
                      day_of_week: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday }
                      meal: { type: string, enum: [breakfast, lunch, dinner] }
                      dish_text: { type: string, maxLength: 200 }
                      not_served: { type: boolean }
                      media_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Menu week with its derived status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuWeekStatus'
        '400':
          $ref: '#/components/responses/RpcError'
        '403':
          $ref: '#/components/responses/RpcError'
  /rest/v1/rpc/copy_menu_week:
    post:
      tags: [rpc]
      summary: Create a draft week pre-filled from another week (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_week_id, week_start]
              properties:
                source_week_id:
                  type: string
                  format: uuid
                week_start:
                  type: string
                  format: date
                  description: Monday of the new week
      responses:
        '200':
          description: New draft week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuWeekStatus'
  /rest/v1/rpc/create_subscription:
    post:
      tags: [rpc]
      summary: Create a subscription with its first period; also used for Renew (admin only, transactional)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
      responses:
        '200':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionSummary'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/void_payment:
    post:
      tags: [rpc]
      summary: Void a payment with a reason; the row is kept (admin only)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, reason]
              properties:
                payment_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Payment voided
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /rest/v1/rpc/anonymise_customer:
    post:
      tags: [rpc]
      summary: Irreversibly remove a customer's personal data, keeping payment amounts (admin only; rules pending Q-34)
      security:
        - supabaseKey: []
          adminJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id]
              properties:
                customer_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Customer anonymised
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    revalidateSecret:
      type: http
      scheme: bearer
      description: Shared secret held in the web host's environment and in Supabase Vault. Not a user credential.
    supabaseKey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase public (anon/publishable) key. Identifies the project only; grants nothing beyond what RLS gives the public role.
    adminJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token of a signed-in user who has an active row in admin_users.
    adminSession:
      type: apiKey
      in: cookie
      name: sb-<project-ref>-auth-token
      description: HTTP-only Supabase session cookie set by the sign-in server action.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RpcError:
      description: PostgREST error from a database function (PT400 validation, PT403 not an admin, PT404 not found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RpcError'
  schemas:
    Error:
      type: object
      description: Route handlers use this shape. RPC errors arrive in PostgREST's shape (code, message, details, hint) and are mapped to this shape by the server actions. Never contains personal data.
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    RpcError:
      type: object
      description: PostgREST's error shape. For PT400, `details` is a JSON array of {field, message} (as text).
      properties:
        code: { type: string, example: PT400 }
        message: { type: string }
        details: { type: string, nullable: true }
        hint: { type: string, nullable: true }
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Release tag or commit of the running artifact
    RevalidateRequest:
      type: object
      properties:
        reason:
          type: string
          enum: [menu_go_live, smoke_test]
    RevalidateResult:
      type: object
      properties:
        revalidated:
          type: boolean
    PublicContent:
      type: object
      description: Versioned document. Money is whole PKR. No personal data.
      required: [schema_version, release, settings, pricing_rules, plans, dishes, addons, faq]
      properties:
        schema_version:
          type: integer
        release:
          type: object
          properties:
            version:
              type: integer
            published_at:
              type: string
              format: date-time
        settings:
          $ref: '#/components/schemas/SiteSettings'
        pricing_rules:
          $ref: '#/components/schemas/PricingRules'
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
        dishes:
          type: array
          items:
            $ref: '#/components/schemas/Dish'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/Addon'
        faq:
          type: array
          items:
            $ref: '#/components/schemas/FaqEntry'
        page_images:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Image'
        menu:
          $ref: '#/components/schemas/LiveMenu'
    SiteSettings:
      type: object
      properties:
        business_name: { type: string }
        tagline: { type: string }
        whatsapp_number:
          type: string
          description: Digits only, international format, for wa.me links
        instagram_handle:
          type: string
        order_hours:
          type: string
        last_order_time:
          type: string
          description: HH:mm or empty
        area_served:
          type: string
          description: Short place name for headings and the footer
        delivery_area_text:
          type: string
        delivery_boundary_text:
          type: string
        legal_name_and_address:
          type: string
        delivery_times:
          type: object
          properties:
            breakfast: { type: string }
            lunch: { type: string }
            dinner: { type: string }
        skip_cutoffs:
          type: object
          properties:
            breakfast: { type: string }
            lunch: { type: string }
            dinner: { type: string }
        skip_cutoff_days:
          type: object
          description: Whether each skip cut-off is the night before or the same day
          properties:
            breakfast: { type: string, enum: [night_before, same_day] }
            lunch: { type: string, enum: [night_before, same_day] }
            dinner: { type: string, enum: [night_before, same_day] }
        skips_per_week:
          type: integer
        payment_methods:
          type: array
          items: { type: string }
    PricingRules:
      type: object
      properties:
        monthly_saving_percent:
          type: number
        breakfast_addon_price:
          type: integer
        team_deal_text:
          type: string
        team_min_people:
          type: integer
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        audience: { type: string }
        meals_included: { type: string }
        price_unit: { type: string, enum: [per_meal, per_day] }
        unit_price: { type: integer }
        weekly_price: { type: integer }
        monthly_price: { type: integer, nullable: true }
        is_most_popular: { type: boolean }
        sort_order: { type: integer }
    Dish:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        comes_with: { type: string }
        price: { type: integer }
        image:
          $ref: '#/components/schemas/Image'
    Addon:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer }
    FaqEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
    Image:
      type: object
      properties:
        path: { type: string, description: Object path in the public media bucket }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }
    LiveMenu:
      type: object
      nullable: true
      properties:
        week_start: { type: string, format: date }
        went_live_at: { type: string, format: date-time }
        is_current_week: { type: boolean, description: False when the newest published week is older than this calendar week (FR-06 fallback) }
        slots:
          type: array
          maxItems: 21
          items:
            $ref: '#/components/schemas/MenuSlot'
    MenuSlot:
      type: object
      properties:
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday }
        meal: { type: string, enum: [breakfast, lunch, dinner] }
        dish_text: { type: string }
        not_served: { type: boolean }
        image:
          $ref: '#/components/schemas/Image'
    DraftStatus:
      type: object
      properties:
        has_unpublished_changes: { type: boolean, description: Checksum of the draft document differs from the live release }
        current_release_version: { type: integer, nullable: true }
        changed_areas:
          type: array
          items: { type: string, enum: [Settings, Pricing rules, Plans, Dishes, Add-ons, FAQ, Images] }
        publish_errors:
          type: array
          description: Reasons publishing would be refused (empty when publishable)
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        scheduled_menu:
          $ref: '#/components/schemas/MenuWeekStatus'
    ReleaseSummary:
      type: object
      properties:
        version: { type: integer }
        published_at: { type: string, format: date-time }
        checksum: { type: string }
    MenuReleaseRequest:
      type: object
      required: [menu_week_id, mode]
      properties:
        menu_week_id: { type: string, format: uuid }
        mode: { type: string, enum: [publish_now, schedule, cancel_schedule] }
        go_live_at: { type: string, format: date-time, description: Required for schedule; must be in the future }
    MenuWeekStatus:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        status: { type: string, enum: [draft, scheduled, published, past], description: "The UI shows published as live" }
        go_live_at: { type: string, format: date-time, nullable: true }
        differs_from_released: { type: boolean }
    SubscriptionCreate:
      type: object
      required: [customer_id, plan_id, term, start_date, end_date, amount_per_period]
      properties:
        customer_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        term: { type: string, enum: [weekly, monthly] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        breakfast_addon: { type: boolean }
        amount_per_period: { type: integer, minimum: 0 }
        amount_note: { type: string }
        due_date: { type: string, format: date, description: Defaults to the day before start_date }
        renewed_from_id: { type: string, format: uuid }
        notes: { type: string }
    SubscriptionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, paused, expired, upcoming] }
        renewal_due: { type: boolean }
        payment_status: { type: string, enum: [paid, unpaid, overdue] }
        balance: { type: integer }
x-server-actions:
  description: Not HTTP endpoints. Next.js server actions in src/admin/server/*.ts; each starts with requireAdmin() (server-side session + active admin check), validates its input with the shared validation modules, writes with the admin's own identity so RLS applies, and returns a serialisable result (never throws to the browser). Sign-in is the one action that runs before a session exists. Listed for traceability only.
  auth: [signInAction, signOutAction, getSessionAction, changePasswordAction]
  content: [getSettingsAction, saveSettingsAction, listPlansAction, savePlansAction, getPricingRulesAction, savePricingRulesAction, listDishesAction, saveDishAction, removeDishAction, moveDishAction, listAddonsAction, saveAddonAction, removeAddonAction, moveAddonAction, listFaqAction, saveFaqAction, removeFaqAction, moveFaqAction]
  menu: [listMenuWeeksAction, saveMenuWeekAction, copyMenuWeekAction, scheduleMenuWeekAction, cancelMenuScheduleAction, publishMenuNowAction]
  media: [listMediaAction, uploadMediaAction, deleteMediaAction]
  publishing: [getPublishOverviewAction, publishAction, rollbackAction, listAuditAction]
  overview: [getOverviewAction, getClockAction]
  customers: [listCustomersAction, getCustomerDetailAction, createCustomerAction, updateCustomerAction, archiveCustomerAction, restoreCustomerAction, findDuplicatePhoneAction]
  subscriptions: [getSubscriptionAction, createSubscriptionAction, updateSubscriptionAction, findOverlapAction]
  payments: [listDuesAction, listPaymentsAction, getPaymentAction, createPaymentAction, updatePaymentAction, voidPaymentAction, findDuplicateReferenceAction]
  not-yet-in-the-ui: [anonymise_customer (database function exists and is tested; no screen calls it yet), in-app admin user management (accounts are created in the Supabase dashboard)]
